[project]
name = "tucurul"
version = "0.1.0"
description = "¿Quién me representa y cómo vota? Localizador de representantes por sección electoral y consolidador de fuentes legislativas de México."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0-only" }
dependencies = []

[project.optional-dependencies]
ingest = [
    "py7zr==1.1.3",
]

[project.scripts]
tucurul = "tucurul.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tucurul"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
